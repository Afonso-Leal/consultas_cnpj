<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta CNPJ</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 Consulta CNPJ</h1>
            <p>Digite o CNPJ para consultar na base de dados</p>
        </header>

        <main>
            <!-- Rota /cnpj -->
            <div class="consulta-box" id="consulta-box">
                <h2>Consultar CNPJ</h2>

                <div class="input-group">
                    <input
                        type="text"
                        id="cnpj-input"
                        placeholder="Digite o CNPJ (apenas números ou formatado)"
                        maxlength="18"
                        autocomplete="off"
                    >
                    <button id="btn-consultar" class="btn-primary">
                        🔍 Consultar
                    </button>
                </div>

                <div class="loading" id="loading" style="display: none;">
                    <div class="spinner"></div>
                    <span>Consultando...</span>
                </div>

                <div id="mensagem" class="mensagem"></div>
            </div>

            <!-- Área de resultados -->
            <div class="resultados" id="resultados" style="display: none;">
                <h3>📊 Resultado da Consulta</h3>

                <!-- CNPJ consultado -->
                <div class="cnpj-consultado" id="cnpj-consultado"></div>

                <!-- Tabela de dados -->
                <div class="table-container" id="tabela-container"></div>
            </div>

            <!-- Área de histórico (opcional) -->
            <div class="historico" id="historico" style="display: none;">
                <h3>📋 Últimas Consultas</h3>
                <ul id="lista-historico"></ul>
            </div>
        </main>

        <footer>
            <p>API conectada ao PostgreSQL via Docker</p>
        </footer>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
